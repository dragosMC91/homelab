server:
  port: 80
  baseURL: "/"
  database: /database/database.db
  # Default "tmp" resolves to /home/filebrowser/tmp, writable only by UID 1000
  # in the image. Keep it in the bind mount so any PUID works and the search
  # index (cacheDir/sql) survives container recreation.
  cacheDir: /database/tmp
  sources:
    - path: /srv
      name: srv
      config:
        # Admin-only (both disks). Not auto-granted: its default scope "/" would
        # expose the whole NAS. Users get their own volume source below instead.
        defaultEnabled: false
        defaultUserScope: "/"
        rules:
          # root-only (700) on every ext4 volume — skip instead of logging
          # "permission denied" on each index pass
          - folderName: "lost+found"
    # Own source because Quantum refuses symlinks that resolve outside a user's
    # scope (the v2-era <user>/shared -> ../shared links no longer work).
    # defaultEnabled grants it to every user, existing ones included, on startup.
    - path: /srv/nas-hdd/shared
      name: shared
      config:
        defaultEnabled: true
        defaultUserScope: "/"
        rules:
          - folderName: "lost+found"
    # One source per user volume (each is its own LVM mount). The sidebar usage
    # bar always describes a whole source, never a user's scope within it, so
    # this is the only way the bar shows the user's own allocation.
    - path: /srv/nas-hdd/dragos
      name: dragos
      config:
        defaultEnabled: false
        rules:
          - folderName: "lost+found"
    - path: /srv/nas-hdd/sonia
      name: sonia
      config:
        defaultEnabled: false
        rules:
          - folderName: "lost+found"
    - path: /srv/nas-hdd/ioana
      name: ioana
      config:
        defaultEnabled: false
        rules:
          - folderName: "lost+found"

auth:
  methods:
    password:
      enabled: true
      signup: false

userDefaults:
  ui:
    darkMode: true
  account:
    permissions:
      download: true

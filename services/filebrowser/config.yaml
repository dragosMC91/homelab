server:
  port: 80
  baseURL: "/"
  database: /database/database.db
  # Default "tmp" resolves to /home/filebrowser/tmp, writable only by UID 1000
  # in the image. Keep it in the bind mount so any PUID works and the search
  # index (cacheDir/sql) survives container recreation.
  cacheDir: /database/tmp
  sources:
    - path: /srv
      name: srv
      config:
        defaultEnabled: true
        defaultUserScope: "/"

auth:
  methods:
    password:
      enabled: true
      signup: false

userDefaults:
  ui:
    darkMode: true
  account:
    permissions:
      download: true

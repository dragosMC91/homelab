services:
  filebrowser:
    # FileBrowser Quantum — migrated from filebrowser/filebrowser (archived
    # upstream 2026-09-01 with unpatched vulns). Config: ./config.yaml.
    image: ghcr.io/gtsteffaniak/filebrowser:1.5.6-stable
    container_name: filebrowser
    restart: unless-stopped

    # Image has no PUID/PGID support — run directly as the target UID/GID.
    user: "${PUID:-1000}:${PGID:-1000}"

    ports:
      - "${TAILSCALE_IP:?Set TAILSCALE_IP in .env}:${FILEBROWSER_PORT:-8082}:80"

    security_opt:
      - no-new-privileges:true

    volumes:
      - /mnt/nas-hdd:/srv/nas-hdd
      - /mnt/nas-ssd:/srv/nas-ssd
      - ./data:/database
      - ./config.yaml:/home/filebrowser/data/config.yaml

    environment:
      - TZ=${TZ:-Europe/Bucharest}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512m

    labels:
      - "com.homelab.service=filebrowser"
      - "com.homelab.description=Web-based File Manager"

    networks:
      - homelab

networks:
  homelab:
    external: true
